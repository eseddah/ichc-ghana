<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chemistry Series | Chemistry Competition Prep</title>
<meta name="theme-color" content="#0F2438">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F2438;--navy-deep:#0A1826;--amber:#E39A3B;--amber-deep:#C97F22;--ink:#1B2430;--line:#DDD8C9;--muted:#6B7280;--bad:#B42318}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#fff;min-height:100vh;display:flex;flex-direction:column}
h1,h2{font-family:Sora,'Plus Jakarta Sans',sans-serif;color:var(--navy);margin:0}
h1{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
h2{font-size:24px;line-height:1.2;font-weight:700}
.bars{display:flex;gap:6px;max-width:560px;width:100%;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 20px 12px}
.bars i{flex:1;height:3px;border-radius:2px;background:#E5E1D4}
.bars i.on{background:var(--navy)}
.hero{position:relative;height:140px;background:var(--navy);overflow:hidden;margin-bottom:46px}
.hero .img{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.05)}
.hero .tint{position:absolute;inset:0;background:rgba(15,36,56,.82)}
.hero svg.tex{position:absolute;inset:0;width:100%;height:100%}
.hero-in{max-width:560px;margin:0 auto;position:relative;height:100%}
.badge{position:absolute;left:20px;bottom:-36px;width:76px;height:76px;border-radius:50%;background:var(--navy);border:4px solid #fff;display:grid;place-items:center}
.badge svg{width:46px;height:46px}
main{flex:1;max-width:560px;width:100%;margin:0 auto;padding:0 20px 28px}
p{margin:14px 0 0}
.note{font-weight:700;color:var(--navy)}
.field{margin-top:22px}
label.l,.lg{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
input[type=text],input[type=email],input[type=tel],input[type=url],select,textarea{width:100%;min-height:52px;padding:13px 14px;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px}
textarea{min-height:104px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,36,56,.12)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:500}
.opt input{width:20px;height:20px;accent-color:var(--navy);margin:0;flex:none}
.opt.sel{border-color:var(--navy);background:#F4F6F9}
.sub{font-size:14px;color:var(--muted);margin:6px 0 0}
.rev{margin:18px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.rev li{display:flex;gap:12px;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.rev b{font-weight:600;color:var(--muted);flex:none;max-width:40%}
.rev span{text-align:right;overflow-wrap:anywhere}
.err{min-height:22px;margin-top:16px;color:var(--bad);font-size:14px;font-weight:600}
.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 12px)}
.nav-in{max-width:560px;margin:0 auto;display:flex;gap:10px}
button{font:inherit;font-weight:700;min-height:52px;border-radius:10px;border:0;cursor:pointer;padding:0 22px}
.next{flex:1;background:var(--navy);color:#fff}
.next:disabled{opacity:.6}
.back{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.flag{height:4px;background:linear-gradient(90deg,#CE1126 0 33.33%,#FCD116 33.33% 66.66%,#006B3F 66.66%)}
@media (min-width:640px){h1{font-size:36px}.hero{height:170px}}

/* clear feedback for every tap */
button,.opt,.cc-item{-webkit-tap-highlight-color:rgba(227,154,59,.35);touch-action:manipulation}
.next,.back,.cc-btn{transition:transform .08s,filter .12s,background .12s}
.next:active,.back:active,.cc-btn:active{transform:scale(.97);filter:brightness(.9)}
.opt{position:relative;transition:background .12s,border-color .12s,transform .08s}
.opt:active{transform:scale(.985);background:#FDF1DE;border-color:var(--amber)}
.opt.sel{border-color:var(--navy);background:#EAF0F6;box-shadow:inset 5px 0 0 var(--amber);font-weight:600}
.opt.sel::after{content:'\2713';margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;background:var(--amber);color:var(--navy);display:grid;place-items:center;font-size:15px;font-weight:800}
.field.bad > label.l,.field.bad > .lg{color:var(--bad)}
.field.bad input,.field.bad select,.field.bad textarea,.field.bad .cc-btn{border-color:var(--bad);background:#FEF3F2}
.field.bad .opt{border-color:#F1B7B1}
.err{transition:background .2s}
.err.show{background:#FEF3F2;border:1.5px solid #F1B7B1;border-radius:10px;padding:10px 12px;animation:nudge .35s}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wa{display:flex;gap:8px;position:relative}
.wa input{flex:1;min-width:0}
.cc-btn{flex:none;min-height:52px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:6px;cursor:pointer}
.cc-btn[aria-expanded=true]{border-color:var(--navy);background:#EAF0F6;box-shadow:0 0 0 3px rgba(15,36,56,.12)}
.cc-panel{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:#fff;border:2px solid var(--navy);border-radius:12px;box-shadow:0 12px 28px rgba(15,36,56,.22);max-height:320px;overflow:auto}
.cc-panel[hidden]{display:none}
.cc-search{position:sticky;top:0;width:100%;border:0;border-bottom:1.5px solid var(--line);border-radius:0;min-height:50px}
.cc-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;min-height:48px;cursor:pointer;border-top:1px solid #EEE9DB}
.cc-item:first-child{border-top:0}
.cc-item b{color:var(--navy)}
.cc-item:active{background:#FDF1DE}
.cc-item.on{background:#EAF0F6;box-shadow:inset 5px 0 0 var(--amber)}
.cc-empty{padding:14px;color:var(--muted);font-size:14px}

/* deadline timer */
.cdwrap{background:var(--navy);color:#fff;border-radius:12px;padding:16px;margin-top:22px;border-bottom:4px solid var(--amber)}
.cdl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700}
.cdu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.cdu .u{background:rgba(255,255,255,.08);border-radius:8px;padding:10px 4px;text-align:center}
.cdu b{display:block;font:800 26px/1.1 Sora,sans-serif;font-variant-numeric:tabular-nums}
.cdu small{font-size:11px;color:#C7D0DA;text-transform:uppercase;letter-spacing:.06em}
.cdw{margin-top:12px;font-size:13px;color:#DDE5EC;line-height:1.55}
.cdw div+div{margin-top:2px;color:#C7D0DA}
.cdmini{display:inline-flex;gap:8px;align-items:center;background:#FDF1DE;border:1px solid #F0D3A4;color:var(--navy);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:14px}
.cdmini b{font-variant-numeric:tabular-nums}
</style>
</head>

}

ychelles:248|Sierra Leone:232|Singapore:65|Slovakia:421|Slovenia:386|Solomon Islands:677|Somalia:252|South Africa:27|South Korea:82|South Sudan:211|Spain:34|Sri Lanka:94|Sudan:249|Suriname:597|Sweden:46|Switzerland:41|Syria:963|Taiwan:886|Tajikistan:992|Tanzania:255|Thailand:66|Timor-Leste:670|Togo:228|Tonga:676|Trinidad and Tobago:1|Tunisia:216|Turkey:90|Turkmenistan:993|Tuvalu:688|Uganda:256|Ukraine:380|United Arab Emirates:971|United Kingdom:44|United States:1|Uruguay:598|Uzbekistan:998|Vanuatu:678|Vatican City:39|Venezuela:58|Vietnam:84|Yemen:967|Zambia:260|Zimbabwe:263'.split('|').map(x => x.split(':'));
const CODESET = new Set(DIAL.map(x => x[1]));
// A number typed with a country code ("+233 24...", "00233 24...") is split into code + number.
function splitCode(raw) {
  let t = String(raw).trim(); if (t.indexOf('00') === 0) t = '+' + t.slice(2);
  if (t.charAt(0) !== '+') return null;
  const d = t.slice(1).replace(/\D/g, '');

function normalizeNum(inp) {
  const raw = inp.value, sp = splitCode(raw);

let cdTimer = null, cdReloads = 0;

  const out = [el('div', {}, g)];
  if (tz && tz !== 'Africa/Accra') out.push(el('div', {}, 'Your time: ' + new Intl.DateTimeFormat('en-GB', { dateStyle: 'medium', timeStyle: 'short' }).format(d) + ' (' + tz.replace(/_/g, ' ') + ')'));
  return out;
}
function cdCard(kind) {
  const t = kind === 'close' ? P.deadline : P.open_at;
  if (!t || new Date(t) <= Date.now()) return null;
  const units = [['d', 'days'], ['h', 'hours'], ['m', 'mins'], ['s', 'secs']];
  const c = el('div', { class: 'cdwrap', role: 'timer', 'data-target': t },
    el('div', { class: 'cdl' }, kind === 'close' ? 'Registration closes in' : 'Registration opens in'),
    el('div', { class: 'cdu' }, units.map(u => el('div', { class: 'u' }, el('b', { 'data-u': u[0] }, '--'), el('small', {}, u[1])))),
    el('div', { class: 'cdw' }, whenLines(t)));
  return c;
}
function miniCd() {
  if (P.state !== 'open' || !P.deadline || new Date(P.deadline) <= Date.now()) return null;
  return el('div', { class: 'cdmini', 'data-target': P.deadline }, 'Closes in ', el('b', { 'data-mini': '1' }, '--'));
}
function tickCd() {
  document.querySelectorAll('[data-target]').forEach(c => {
    const ms = new Date(c.dataset.target) - Date.now();
    if (ms <= 0) { if (!c.dataset.done) { c.dataset.done = '1'; if (++cdReloads <= 3) setTimeout(load, 1200); } }
    const x = Math.max(0, ms), v = { d: Math.floor(x / 864e5), h: Math.floor(x % 864e5 / 36e5), m: Math.floor(x % 36e5 / 6e4), s: Math.floor(x % 6e4 / 1e3) };
    c.querySelectorAll('[data-u]').forEach(b => { b.textContent = b.dataset.u === 'd' ? v.d : two(v[b.dataset.u]); });
    const mi = c.querySelector('[data-mini]'); if (mi) mi.textContent = v.d + 'd ' + two(v.h) + 'h ' + two(v.m) + 'm ' + two(v.s) + 's';
  });
}
function startCd() { clearInterval(cdTimer); if (!document.querySelector('[data-target]')) return; tickCd(); cdTimer = setInterval(tickCd, 1000); }
const lab = (list, v) => ((list || []).find(o => o.value === v) || {}).label || v;

function view() {
  const m = $('#main'); m.innerHTML = '';
  const f = C.fields, o = C.options, br = C.branches;
  if (step === 0) {
    m.append(el('h1', {}, C.heading), el('p', {}, C.intro)); const cc0 = P.state === 'open' ? cdCard('close') : null; if (cc0) m.append(cc0); m.append(el('p', { class: 'note' }, C.note));
  } else if (step === 1) {
    const mc = miniCd(); if (mc) m.append(mc);
    m.append(el('h2', {}, C.steps[1]), text('full_name', f.full_name), text('email', f.email, 'email'), countrySelect(f.country || 'Country'), text('city', f.city || 'City or town (optional)'), waField(f.whatsapp), text('institution', f.institution), choice('role', f.role, roleOpts(), v => { $('#roleOtherBox').style.display = v === 'other' ? '' : 'none'; if (v === 'other') $('#role_other').focus(); }), roleOtherBox());
  } else if (step === 2) {
    { const mc = miniCd(); if (mc) m.append(mc); }
    m.append(el('h2', {}, C.steps[2]), choice('intent', f.intent, o.intent));
  } else if (step === 3) {
    { const mc = miniCd(); if (mc) m.append(mc); }
    m.append(el('h2', {}, br[D.intent].title));
    if (D.intent === 'attend') m.append(select('attend_session', br.attend.session, o.months), area('attend_question', br.attend.question), choice('attend_reminder', br.attend.reminder, o.reminder));
    if (D.intent === 'suggest') m.append(text('topic', br.suggest.topic), area('topic_reason', br.suggest.reason));
    if (D.intent === 'speak') m.append(text('speak_field', br.speak.field), text('speak_title', br.speak.talk_title), choice('speak_track', br.speak.track, o.track), area('speak_bio', br.speak.bio), text('speak_link', br.speak.link, 'url', 'https://'), select('speak_month', br.speak.month, o.months));
    { const bt = multi('best_times', f.best_times, o.best_times); const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').replace(/_/g, ' ');
      bt.querySelector('.lg').after(el('p', { class: 'sub', style: 'margin:-2px 0 10px;' }, (C.times_note || 'Session times are in Ghana time (GMT). Choose every slot that could work for you.') + (tz && tz !== 'Africa/Accra' ? ' Your device time zone: ' + tz + '.' : ''))); m.append(bt); }
  } else {
    const rows = [[f.full_name, D.full_name], [f.email, D.email], [f.country || 'Country', D.country], ...(val('city') ? [[(f.city || 'City').replace(' (optional)', ''), val('city')]] : []), [f.whatsapp.replace(' (optional)', ''), fullWa() || '–'], [f.institution, D.institution], [f.role, D.role === 'other' ? 'Other: ' + val('role_other') : lab(roleOpts(), D.role)], [f.intent, lab(o.intent, D.intent)]];
    const map = { attend: [['attend_session', br.attend.session], ['attend_question', br.attend.question], ['attend_reminder', br.attend.reminder]], suggest: [['topic', br.suggest.topic], ['topic_reason', br.suggest.reason]], speak: [['speak_field', br.speak.field], ['speak_title', br.speak.talk_title], ['speak_track', br.speak.track], ['speak_bio', br.speak.bio], ['speak_link', br.speak.link], ['speak_month', br.speak.month]] };
    map[D.intent].forEach(([k, l]) => { const v = D[k]; if (v) rows.push([l, k === 'attend_reminder' ? lab(o.reminder, v) : k === 'speak_track' ? lab(o.track, v) : v]); });
    rows.push([f.best_times.replace(/ \(.*\)/, ''), D.best_times.join(', ')]);
    { const mc = miniCd(); if (mc) m.append(mc); }
    m.append(el('h2', {}, C.review.title), el('ul', { class: 'rev' }, rows.map(r => el('li', {}, el('b', {}, r[0]), el('span', {}, r[1])))),
      el('div', { class: 'field', id: 'g_consent' }, el('label', { class: 'opt' + (D.consent ? ' sel' : '') }, el('input', { type: 'checkbox', checked: !!D.consent, onChange: e => { D.consent = e.target.checked; e.target.closest('.opt').classList.toggle('sel', D.consent); buzz(); e.target.closest('.field').classList.remove('bad'); } }), f.consent)));
  }
  m.append(el('div', { class: 'err', id: 'err', role: 'alert' }));

  $('#next').textContent = step === 0 ? C.buttons.start : step === STEPS - 1 ? C.buttons.submit : C.buttons.next;

}

function syncDom() {
  document.querySelectorAll('#main input[id], #main textarea[id], #main select[id]').forEach(e => {
    if (e.type === 'checkbox' || e.type === 'radio' || e.type === 'search') return;
    if (e.id === 'wa_num') { normalizeNum(e); return; }
    D[e.id] = e.value;
  });
  document.querySelectorAll('#main input[type=radio]:checked').forEach(r => { D[r.name] = r.value; });
  const bt = document.querySelectorAll('#g_best_times input[type=checkbox]'); if (bt.length) D.best_times = [...bt].filter(c => c.checked).map(c => c.value);
  const cons = document.querySelector('#g_consent input[type=checkbox]'); if (cons) D.consent = cons.checked;

function check() {
  const e = [], bad = (m, id) => e.push([m, id]);
  if (step === 1) {
    if (val('full_name').length < 2) bad('Enter your full name.', 'full_name');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val('email'))) bad('Enter a valid email address.', 'email');
    const wp = waProblem(); if (wp) bad(wp, 'wa_num');
    if (val('institution').length < 2) bad('Enter your school or university.', 'institution');
    if (!D.country) bad('Choose your country.', 'country');
    if (!D.role) bad('Choose your role.', 'g_role');
    else if (D.role === 'other' && val('role_other').length < 2) bad('Tell us your role in the box under “Other”.', 'role_other');
  } else if (step === 2) {
    if (!D.intent) bad('Choose how you would like to join.', 'g_intent');
  } else if (step === 3) {
    if (D.intent === 'attend') {
      if (!D.attend_session) bad('Choose a preferred session or month.', 'attend_session');
      if (!D.attend_reminder) bad('Choose how you want reminders.', 'g_attend_reminder');
      else if (D.attend_reminder === 'whatsapp' && !fullWa()) bad('You chose WhatsApp reminders, so go Back and add your WhatsApp number.', 'g_attend_reminder');
    }
    if (D.intent === 'suggest') {
      if (val('topic').length < 3) bad('Tell us your topic or question.', 'topic');
      if (val('topic_reason').length < 3) bad('Add a line on why it matters.', 'topic_reason');
    }
    if (D.intent === 'speak') {
      if (val('speak_field').length < 2) bad('Enter your field of expertise.', 'speak_field');
      if (val('speak_title').length < 3) bad('Enter a talk title.', 'speak_title');
      if (!D.speak_track) bad('Choose a track.', 'g_speak_track');
      if (val('speak_bio').length < 10) bad('Write a short bio (at least a sentence).', 'speak_bio');
      if (val('speak_link') && !/^https?:\/\/\S+$/i.test(val('speak_link'))) bad('The link must start with https://', 'speak_link');

function showErr(m) {

  else er.scrollIntoView({ behavior: 'smooth', block: 'center' });

async function submit() {
  const btn = $('#next'); btn.disabled = true; btn.textContent = 'Submitting…';
  const body = Object.assign({}, D, { consent: true, whatsapp: fullWa() });
  delete body.wa_cc; delete body.wa_num;
  try { body.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  try {
    const r = await fetch(SB + '/functions/v1/series-submit', { method: 'POST', headers: hdr, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) return thanks();
    const m = String(j.error || '');
    if (m === 'duplicate') throw new Error('You have already registered for this option with this email address.');
    if (m === 'series_closed' || m === 'series_not_open') { await load(); return; }
    if (m.startsWith('invalid:')) throw new Error('Please check your details and try again (' + m.slice(8).replace(/_/g, ' ') + ').');
    throw new Error('We could not submit your registration. Please try again.');

  startCd();

async function load() {

    const r = await fetch(SB + '/rest/v1/rpc/series_public', { method: 'POST', headers: hdr, body: '{}' });
