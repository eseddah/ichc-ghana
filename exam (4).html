<script>
const CHEM_EL = new Set('H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'.split(' '));
const CHEM_SUB = '₀₁₂₃₄₅₆₇₈₉', CHEM_SUP = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻' };
const chemSub = d=>String(d).replace(/\d/g, c=>CHEM_SUB[c]);
const chemSup = d=>String(d).replace(/[\d+-]/g, c=>CHEM_SUP[c]);
function chemParse(body){
  // returns { out, groups, simple } or null when body is not a chemical formula
  let i = 0, out = '', n = 0, depth = 0, lastDigits = '', hasParen = false;
  while(i < body.length){
    const ch = body[i];
    if(ch === '('){ depth++; hasParen = true; out += '('; i++; lastDigits = ''; continue; }
    if(ch === ')'){ if(!depth) return null; depth--; out += ')'; i++; let d = ''; while(/\d/.test(body[i]||'')) d += body[i++]; if(d) out += chemSub(d); lastDigits = d; continue; }
    if(/[A-Z]/.test(ch)){
      let sym = ch;
      if(/[a-z]/.test(body[i+1]||'')){ if(CHEM_EL.has(ch + body[i+1])){ sym = ch + body[i+1]; i++; } else return null; }
      else if(!CHEM_EL.has(ch)) return null;
      i++; let d = ''; while(/\d/.test(body[i]||'')) d += body[i++];
      out += sym; n++; if(d) out += chemSub(d); lastDigits = d; continue;
    }
    return null;
  }
  if(depth || !n) return null;
  return { out, groups:n, hasParen, lastDigits };
}
// Chemistry wording -> real symbols (Greek letters, degrees, units, maths signs). Safe to run twice on the same text.
const CHEM_GREEK = { alpha:'α', beta:'β', gamma:'γ', delta:'δ', sigma:'σ', pi:'π', lambda:'λ', theta:'θ', epsilon:'ε', rho:'ρ', omega:'ω', phi:'φ', tau:'τ', mu:'μ' };
function chemSymbols(t){
  // delta as a change: "delta H", "Delta G°", "delta-H", "delta Hf", "delta T", "delta t", "delta pH", "delta[A]" -> ΔH, ΔG°, ΔHf, ΔT, Δt, ΔpH, Δ[A]
  t = t.replace(/\b(?:[Dd]elta|DELTA)(?:-|[ \t])?(?=(?:[HGSEUTPVAQ][°º⁰]?(?:f|c|b|m|r|rxn|vap|fus|sub|sol|soln|lat|hyd|ion|comb|cell|mix|atom|diss|neut|app)?|[tnxpvmc]|pH|pOH|pKa|pKb)(?![A-Za-z])|\[)/g, 'Δ');
  // partial charges: "delta+", "delta-", "delta(+)", "delta positive" -> δ⁺ / δ⁻
  t = t.replace(/\b[Dd]elta(?:\(([+-])\)|([+-]))(?![A-Za-z0-9])/g, (m, a, b)=> 'δ' + ((a||b)==='+' ? '⁺' : '⁻'));
  t = t.replace(/\b[Dd]elta[ \t]+(positive|negative)\b/g, (m, w)=> 'δ' + (w==='positive' ? '⁺' : '⁻'));
  // standard-state sign after a thermodynamic delta: ΔG0, ΔH^o, ΔSº -> ΔG°, ΔH°, ΔS°
  t = t.replace(/Δ([HGSEU])(?:\^\{?[0o]\}?|[0oº⁰])(?![A-Za-z0-9])/g, 'Δ$1°');

async function showResultFor(id, secret){
  try{ const j = await api('review', { attemptId:id, secret:secret || undefined, session:S.session }); if(j.void){ app().innerHTML = '<div class="empty">This attempt was voided by the Ambassador. If you think this is a mistake, please contact the programme team.</div>'; return; } paintResult(j.result, 'after', secret); }
  catch(e){ toast(e.message, 5000); route(); }
}
async function openReview(id, toMsg){
  app().innerHTML = '<div class="empty">Loading…</div>';
  try{ const j = await api('review', { attemptId:id, session:S.session }); if(j.void){ app().innerHTML = '<div class="empty">This attempt was voided by the Ambassador.</div><div class="row sect"><button class="pill" data-act="home">Back</button></div>'; return; } paintResult(j.result, 'review'); if(toMsg){ const d = $('#disp'); if(d) d.scrollIntoView({ behavior:'smooth', block:'start' }); } }
  catch(e){ toast(e.message, 5000); route(); }
}
async function loadThread(id){
  const el = $('#dThread'); if(!el || !S.session) return;
  try{ const j = await api('messages', { session:S.session, attemptId:id }); el.innerHTML = j.messages.map(m=> `<div class="msg ${m.from === 'visitor' ? 'you' : ''}">${esc(m.body)}<small>${m.from === 'visitor' ? 'You' : 'Ambassador'} · ${esc(fmtWhen(m.at))}</small></div>`).join(''); }catch(e){}
}
async function sendMsg(id){
  const t = $('#dMsg'), out = $('#dOut'), qn = $('#dQ').value; let body = t.value.trim();
  if(body.length < 10){ out.innerHTML = '<div class="err">Please write a little more so the Ambassador can understand your concern.</div>'; return; } if(qn) body = `[Question ${qn}] ` + body;
  out.innerHTML = ''; try{ await api('send_message', { attemptId:id, session:S.session, secret:(S.view && S.view.secret) || undefined, body }); }catch(e){ out.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  t.value = ''; out.innerHTML = '<div class="okmsg">Sent. The Ambassador will reply here and by email.</div>'; if(S.session) loadThread(id);
}

// ---------------------------------------------------------------- clicks
document.addEventListener('click', e=>{
  const b = e.target.closest ? e.target.closest('[data-act]') : null; if(!b) return; const a = b.dataset.act, id = b.dataset.id;
  switch(a){
    case 'reload': return route();
    case 'login': return openLogin();
    case 'signup': return openAuth({ mode:'signup' });
    case 'closeModal': return closeModal();
    case 'home': S.tab = 'overview'; return route();
    case 'start': return openStart(id);
    case 'resume': return resume(id);
    case 'ics': { const x = examById(id); if(x) icsFor(x); return; }
    case 'tab': S.tab = id; paintTab(); if(id !== 'messages' && S.session) loadMe().then(()=>{ if(S.tab === id && $('#tabBody')) paintTab(); }).catch(()=>{}); return;
    case 'review': return openReview(id);
    case 'remind': return remindToggle(id);
    case 'saveprofile': return saveProfile();
    case 'printall': return printAll();
    case 'printone': return printOne(id);
    case 'printres': return S.lastRes ? printSlip(S.lastRes) : null;
    case 'google': return googleStart();
    case 'argue': return openReview(id, true);
    case 'copyref': try{ navigator.clipboard.writeText(b.dataset.ref); toast('Reference copied.'); }catch(x){ toast(b.dataset.ref); } return;
    case 'sendmsg': return sendMsg(id);
    case 'xopt': return xpPick(+b.dataset.i);
    case 'xnext': return xpNext(false);
    case 'xpick': { const f = $('#xpFile'); if(f){ XP.pickUntil = Date.now() + 60000; f.click(); } return; }
    case 'xdel': { const q = XP.qs[XP.qi]; if(q){ XP.files[q.id] = (XP.files[q.id] || []).filter(p=> p !== b.dataset.p); xpThumbs(); xpQueueSave(true); } return; }
  }
});
googleReturn().then(()=> route());
if(/[?&]login=1/.test(location.search) && !S.session) setTimeout(()=> openLogin(), 300);
})();
</script>
